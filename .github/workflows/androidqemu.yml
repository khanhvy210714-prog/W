name: Android-x86 QEMU BIOS Runner

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Nhập Tailscale Authkey'
        required: true
        default: ''
      android_version:
        description: 'Chọn phiên bản Android (5, 7, 8, new)'
        required: true
        default: 'new'
        type: choice
        options:
          - 'new'
          - '8'
          - '7'
          - '5'
      display_type:
        description: 'Chọn màn hình: spice (B - mặc định) hoặc vnc (A)'
        required: true
        default: 'spice'
        type: choice
        options:
          - 'spice'
          - 'vnc'
      vga_type:
        description: 'Chọn Card màn hình: virtio (B - mặc định) hoặc qxl (A)'
        required: true
        default: 'virtio'
        type: choice
        options:
          - 'virtio'
          - 'qxl'
      audio_type:
        description: 'Chọn loại Âm thanh (Chỉ áp dụng cho SPICE): ac97 (B - mặc định) hoặc hda (A)'
        required: true
        default: 'ac97'
        type: choice
        options:
          - 'ac97'
          - 'hda'

concurrency:
  group: android-qemu-runner
  cancel-in-progress: true

jobs:
  run-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install QEMU, SPICE, VNC & Tailscale
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies x11vnc xvfb qemu-system-x86 qemu-utils wget curl spice-vdagent libspice-server-dev libvirglrenderer1
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ github.event.inputs.tailscale_authkey }}
        run: |
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-ubuntu-android --accept-routes || true

      - name: Restore System Disk
        run: |
          if ls android_disk.tar.gz.part* 1> /dev/null 2>&1; then
            echo "Đang ghép và khôi phục đĩa Android từ backup..."
            cat android_disk.tar.gz.part* > android_disk.tar.gz
            tar -xzf android_disk.tar.gz
            touch androidinstalled.flag
            rm -f android_disk.tar.gz
          else
            echo "Chưa có backup, khởi tạo đĩa QCOW2 64GB mới..."
            qemu-img create -f qcow2 android.qcow2 64G
          fi

      - name: Download Selected Android ISO
        env:
          ANDROID_VER: ${{ github.event.inputs.android_version }}
        run: |
          if [ ! -f "androidinstalled.flag" ]; then
            case "$ANDROID_VER" in
              "5")
                ISO_URL="https://sourceforge.net/projects/android-x86/files/Release%205.1/android-x86-5.1-rc1.iso/download"
                ;;
              "7")
                ISO_URL="https://sourceforge.net/projects/android-x86/files/Release%207.1/android-x86_64-7.1-r5.iso/download"
                ;;
              "8")
                ISO_URL="https://sourceforge.net/projects/android-x86/files/Release%208.1/android-x86_64-8.1-r6.iso/download"
                ;;
              *)
                ISO_URL="https://sourceforge.net/projects/android-x86/files/latest/download"
                ;;
            esac

            echo "Đang tải Android ISO từ SourceForge: $ISO_URL"
            wget -O android.iso -L "$ISO_URL"
          fi

      - name: Launch QEMU Android Max Performance
        env:
          ANDROID_VER: ${{ github.event.inputs.android_version }}
          DISPLAY_CHOICE: ${{ github.event.inputs.display_type }}
          VGA_CHOICE: ${{ github.event.inputs.vga_type }}
          AUDIO_CHOICE: ${{ github.event.inputs.audio_type }}
        run: |
          # 1. Cấu hình RAM theo phiên bản Android
          case "$ANDROID_VER" in
            "5") RAM_MB=6144 ;;     # 6 GB
            "7") RAM_MB=8192 ;;     # 8 GB
            "8") RAM_MB=12288 ;;    # 12 GB
            *)   RAM_MB=16384 ;;    # 16 GB (Bản new / 9.0)
          esac

          # 2. Cấu hình CDROM / Boot order
          CDROM_ARG=""
          BOOT_ARG=""
          if [ ! -f "androidinstalled.flag" ] && [ -f "android.iso" ]; then
            echo "Chưa cài đặt: Boot từ ISO..."
            CDROM_ARG="-drive file=android.iso,media=cdrom,if=none,id=cdrom0,cache=writeback,aio=threads,throttling.bps-total=805306368 -device ide-cd,bus=ahci0.1,drive=cdrom0"
            BOOT_ARG="-boot order=d,menu=on"
          else
            echo "Đã cài xong: Boot từ đĩa cứng..."
            BOOT_ARG="-boot order=c"
          fi

          # 3. Cấu hình Card Màn Hình (VRAM 256MB)
          if [ "$VGA_CHOICE" = "qxl" ]; then
            VGA_ARG="-vga qxl -global qxl-vga.vram_size=268435456 -global qxl-vga.ram_size=268435456"
          else
            VGA_ARG="-device virtio-vga -global virtio-vga.max_hostmem=268435456"
          fi

          # 4. Khởi chạy VNC Desktop Ubuntu (Luôn mở trên cổng 5900)
          Xvfb :0 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
          sleep 2
          DISPLAY=:0 startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 2
          x11vnc -display :0 -forever -shared -rfbport 5900 -nopw > /tmp/x11vnc.log 2>&1 &

          # 5. Cấu hình Display & Audio tùy thuộc vào màn hình chọn (VNC hoặc SPICE)
          if [ "$DISPLAY_CHOICE" = "vnc" ]; then
            # Chọn VNC Android -> Tắt audio (VNC không hỗ trợ driver audio)
            AUDIO_ARG=""
            DISPLAY_ARG="-vnc :1" # Mở VNC Android ở cổng 5901
          else
            # Chọn SPICE Android -> Bật âm thanh theo cấu hình
            if [ "$AUDIO_CHOICE" = "hda" ]; then
              AUDIO_ARG="-audiodev spice,id=snd0 -device intel-hda -device hda-duplex,audiodev=snd0"
            else
              AUDIO_ARG="-audiodev spice,id=snd0 -device ac97,audiodev=snd0"
            fi
            DISPLAY_ARG="-spice port=5902,addr=0.0.0.0,disable-ticketing=true,image-compression=glz,jpeg-wan-compression=always,zlib-glz-wan-compression=always,streaming-video=filter,playback-compression=on"
          fi

          # 6. Chạy QEMU BIOS (Ghi log trực tiếp ra qemu.log để kiểm tra lỗi)
          sudo qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,hpet=off,accel=kvm \
            -cpu host,migratable=off,lm=on,kvm=off \
            -smp 4,sockets=1,cores=4,threads=1 \
            -m $RAM_MB \
            $VGA_ARG \
            $BOOT_ARG \
            -device ahci,id=ahci0 \
            -drive file=android.qcow2,format=qcow2,if=none,id=hda0,discard=unmap,cache=writeback,cache.direct=off,l2-cache-size=768M,throttling.bps-total=805306368,aio=threads,detect-zeroes=on \
            -device ide-hd,bus=ahci0.0,drive=hda0,rotation_rate=1 \
            $CDROM_ARG \
            -device usb-ehci,id=usb -device usb-tablet,bus=usb.0 \
            -net nic,model=virtio -net user,hostfwd=tcp::5555-:5555 \
            $AUDIO_ARG \
            $DISPLAY_ARG > qemu.log 2>&1 &
          
          sleep 5
          echo "--- LOG QEMU BAN ĐẦU ---"
          cat qemu.log || true

      - name: Show Connection Info
        run: |
          sleep 5
          tailscale_ip=$(tailscale ip -4 || echo "Chưa kết nối Tailscale")
          AUDIO_STATUS="${{ github.event.inputs.audio_type }}"
          if [ "${{ github.event.inputs.display_type }}" = "vnc" ]; then
            AUDIO_STATUS="Không hỗ trợ (Đang dùng VNC)"
          fi

          echo "=========================================="
          echo "IP TAILSCALE UBUNTU HOST: $tailscale_ip"
          echo "1. VNC UBUNTU DESKTOP:          $tailscale_ip:5900"
          if [ "${{ github.event.inputs.display_type }}" = "vnc" ]; then
            echo "2. VNC ANDROID (Đã chọn):       $tailscale_ip:5901"
          else
            echo "2. SPICE ANDROID (Đã chọn):     $tailscale_ip:5902"
          fi
          echo "3. ÂM THANH STATUS:             $AUDIO_STATUS"
          echo "4. ADB ANDROID CONNECT:         $tailscale_ip:5555"
          echo "=========================================="

      - name: Keep Alive (4 Hours)
        run: |
          sleep 14400

      - name: Backup Disk Before Runner Expires
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config --global http.postBuffer 1073741824
          git config --global pack.windowMemory "256m"
          git config --global pack.packSizeLimit "256m"

          sudo pkill -f qemu-system-x86_64 || true
          sleep 5

          git rm -f android_disk.tar.gz.part* || true
          rm -f android_disk.tar.gz*

          if [ -f "android.qcow2" ]; then
            echo "1. Nén đĩa QCOW2 Android..."
            qemu-img convert -c -O qcow2 android.qcow2 android_compressed.qcow2
            mv android_compressed.qcow2 android.qcow2

            echo "2. Đóng gói và cắt nhỏ file backup 40MB..."
            tar -czf android_disk.tar.gz android.qcow2
            split -b 40M android_disk.tar.gz android_disk.tar.gz.part
            rm -f android_disk.tar.gz
          fi

          touch androidinstalled.flag

          git add android_disk.tar.gz.part* androidinstalled.flag || true
          git commit -m "Auto backup Android QEMU Disk [skip ci]" || true
          
          echo "3. Đẩy dữ liệu backup lên GitHub..."
          for i in {1..5}; do
            git push origin main && break || echo "Lần push thứ $i thất bại, đang thử lại..."
            sleep 10
          done
