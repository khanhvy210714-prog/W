name: Android-x86 QEMU BIOS Runner

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Nhập Tailscale Authkey'
        required: true
        default: ''
      android_version:
        description: 'Chọn phiên bản Android (5, 7, 8, new)'
        required: true
        default: 'new'
        type: choice
        options:
          - 'new'
          - '8'
          - '7'
          - '5'
      display_type:
        description: 'Chọn màn hình Android: spice hoặc vnc'
        required: true
        default: 'spice'
        type: choice
        options:
          - 'spice'
          - 'vnc'
      use_web_client:
        description: 'Dùng NoVNC/NoSPICE trên Web (Tự động mở link, không cần app ngoài)?'
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'
      kvm_driver:
        description: 'Cài KVM Driver vào Android Guest? (d: Mặc định)'
        required: true
        default: 'd'
        type: choice
        options:
          - 'd'
          - 'y'
          - 'n'
      vga_type:
        description: 'Chọn Card màn hình: virtio (mặc định) hoặc qxl'
        required: true
        default: 'virtio'
        type: choice
        options:
          - 'virtio'
          - 'qxl'
      audio_type:
        description: 'Chọn loại Âm thanh: ac97 (mặc định) hoặc hda'
        required: true
        default: 'ac97'
        type: choice
        options:
          - 'ac97'
          - 'hda'

concurrency:
  group: android-qemu-runner
  cancel-in-progress: false

jobs:
  run-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Dependencies & Web Clients
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies x11vnc xvfb qemu-system-x86 qemu-utils wget curl git-lfs spice-vdagent libspice-server-dev novnc websockify python3-pip
          git lfs install
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # Cài đặt spice-html5 để phục vụ Web NoSPICE
          sudo git clone https://gitlab.freedesktop.org/spice/spice-html5.git /usr/share/spice-html5 || true

      - name: Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ github.event.inputs.tailscale_authkey }}
        run: |
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-ubuntu-android --accept-routes || true

      - name: Launch Ubuntu Desktop VNC Server (:0 - Port 5900)
        run: |
          Xvfb :0 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:0 startxfce4 > /dev/null 2>&1 &
          sleep 2
          x11vnc -display :0 -forever -shared -rfbport 5900 -nopw > /dev/null 2>&1 &
          sleep 2

      - name: Restore System Disk
        run: |
          if ls android_disk.tar.gz.part* 1> /dev/null 2>&1; then
            echo "Đang ghép và khôi phục đĩa Android từ backup..."
            cat android_disk.tar.gz.part* > android_disk.tar.gz
            tar -xzf android_disk.tar.gz
            touch androidinstalled.flag
            rm -f android_disk.tar.gz
            echo "Khôi phục dữ liệu thành công!"
          else
            echo "Khởi tạo đĩa QCOW2 64GB mới..."
            qemu-img create -f qcow2 android.qcow2 64G
          fi

      - name: Download Selected Android ISO
        env:
          ANDROID_VER: ${{ github.event.inputs.android_version }}
        run: |
          if [ ! -f "androidinstalled.flag" ]; then
            case "$ANDROID_VER" in
              "5")
                ISO_URL="https://sourceforge.net/projects/android-x86/files/Release%205.1/android-x86-5.1-rc1.iso/download"
                ;;
              "7")
                ISO_URL="https://sourceforge.net/projects/android-x86/files/Release%207.1/android-x86_64-7.1-r5.iso/download"
                ;;
              "8")
                ISO_URL="https://sourceforge.net/projects/android-x86/files/Release%208.1/android-x86_64-8.1-r6.iso/download"
                ;;
              *)
                ISO_URL="https://sourceforge.net/projects/android-x86/files/latest/download"
                ;;
            esac

            echo "Đang tải Android ISO: $ISO_URL"
            wget -O android.iso -L "$ISO_URL"
          fi

      - name: Launch QEMU Android Max Performance
        env:
          ANDROID_VER: ${{ github.event.inputs.android_version }}
          DISPLAY_CHOICE: ${{ github.event.inputs.display_type }}
          VGA_CHOICE: ${{ github.event.inputs.vga_type }}
          AUDIO_CHOICE: ${{ github.event.inputs.audio_type }}
          KVM_OPT: ${{ github.event.inputs.kvm_driver }}
        run: |
          case "$ANDROID_VER" in
            "5") RAM_MB=6144 ;;
            "7") RAM_MB=8192 ;;
            "8") RAM_MB=12288 ;;
            *)   RAM_MB=16384 ;;
          esac

          CDROM_ARG=""
          BOOT_ARG=""
          if [ ! -f "androidinstalled.flag" ] && [ -f "android.iso" ]; then
            CDROM_ARG="-drive file=android.iso,media=cdrom,readonly=on"
            BOOT_ARG="-boot order=dc,menu=on"
          else
            BOOT_ARG="-boot order=c"
          fi

          if [ "$VGA_CHOICE" = "qxl" ]; then
            VGA_ARG="-vga qxl -global qxl-vga.vram_size=268435456 -global qxl-vga.ram_size=268435456"
          else
            VGA_ARG="-device virtio-vga,max_hostmem=268435456"
          fi

          if [ "$AUDIO_CHOICE" = "hda" ]; then
            AUDIO_ARG="-audiodev spice,id=spice-audio -device ich9-intel-hda -device hda-duplex,audiodev=spice-audio"
          else
            AUDIO_ARG="-audiodev spice,id=spice-audio -device ac97,audiodev=spice-audio"
          fi

          # Giữ nguyên CPU max gốc, nếu chọn kvm='y' hoặc 'd' thì pass thêm flag kvm vào CPU guest
          if [ "$KVM_OPT" = "n" ]; then
            CPU_ARG="-cpu max"
          else
            CPU_ARG="-cpu max,+kvm_pv_eoi,+kvm_pv_unhalt"
          fi

          if [ "$DISPLAY_CHOICE" = "vnc" ]; then
            DISPLAY_ARG="-vnc :2"
          else
            DISPLAY_ARG="-spice port=5902,addr=0.0.0.0,disable-ticketing=on,image-compression=glz,jpeg-wan-compression=always,zlib-glz-wan-compression=always,playback-compression=off"
          fi

          sudo qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,hpet=off,accel=kvm \
            $CPU_ARG \
            -smp 4,sockets=1,cores=4,threads=1 \
            -m $RAM_MB \
            $VGA_ARG \
            $BOOT_ARG \
            -drive file=android.qcow2,format=qcow2,if=virtio,id=hda0,discard=unmap,cache=writeback,cache.direct=off,l2-cache-size=768M,throttling.bps-total=805306368,aio=threads,detect-zeroes=on \
            $CDROM_ARG \
            -device usb-ehci,id=usb -device usb-tablet,bus=usb.0 \
            -netdev user,id=net0,hostfwd=tcp::5555-:5555 \
            -device e1000,netdev=net0 \
            $AUDIO_ARG \
            $DISPLAY_ARG &
          sleep 5

      - name: Setup Web Bridge (NoVNC / NoSPICE)
        env:
          DISPLAY_CHOICE: ${{ github.event.inputs.display_type }}
          USE_WEB: ${{ github.event.inputs.use_web_client }}
        run: |
          if [ "$USE_WEB" = "y" ]; then
            if [ "$DISPLAY_CHOICE" = "vnc" ]; then
              echo "Khởi chạy Web NoVNC Bridge trên Cổng 6080..."
              websockify --web /usr/share/novnc/ 6080 localhost:5902 > /dev/null 2>&1 &
            else
              echo "Khởi chạy Web NoSPICE Bridge trên Cổng 6080..."
              websockify --web /usr/share/spice-html5/ 6080 localhost:5902 > /dev/null 2>&1 &
            fi
            sleep 2
          fi

      - name: Show Connection Info
        env:
          DISPLAY_CHOICE: ${{ github.event.inputs.display_type }}
          USE_WEB: ${{ github.event.inputs.use_web_client }}
          KVM_OPT: ${{ github.event.inputs.kvm_driver }}
        run: |
          sleep 5
          tailscale_ip=$(tailscale ip -4 || echo "Chưa kết nối Tailscale")
          echo "=========================================="
          echo "IP TAILSCALE UBUNTU HOST: $tailscale_ip"
          echo "1. VNC DESKTOP HOST:     $tailscale_ip:5900"
          
          if [ "$USE_WEB" = "y" ]; then
            if [ "$DISPLAY_CHOICE" = "vnc" ]; then
              echo "2. LINK NOVNC WEB DIRECT: http://$tailscale_ip:6080/vnc.html?host=$tailscale_ip&port=6080"
            else
              echo "2. LINK NOSPICE WEB DIRECT: http://$tailscale_ip:6080/spice_auto.html?host=$tailscale_ip&port=6080"
            fi
          else
            echo "2. ANDROID DISPLAY ($DISPLAY_CHOICE App): $tailscale_ip:5902"
          fi
          
          echo "3. ADB CONNECT:          $tailscale_ip:5555"
          echo "=========================================="
          echo ""
          if [ "$KVM_OPT" != "n" ]; then
            echo "[LƯU Ý KVM DRIVER]: Nếu Android Guest báo lỗi 'no such file or directory /dev/kvm', hãy mở Termux/Terminal trong Android gõ:"
            echo "su"
            echo "mknod /dev/kvm c 10 232 && chmod 666 /dev/kvm"
          fi
          echo "=========================================="

      - name: Keep Alive (4 Hours)
        run: |
          sleep 14400

      - name: Backup Disk Before Runner Expires
        if: always()
        run: |
          echo "Đang dừng QEMU và tiến hành Backup dữ liệu..."
          sudo pkill -f qemu-system-x86_64 || true
          sleep 5

          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 9

          git fetch origin main || true
          git rebase origin main || true

          git rm -f android_disk.tar.gz.part* || true
          rm -f android_disk.tar.gz*

          if [ -f "android.qcow2" ]; then
            echo "1. Nén đĩa QCOW2 Android..."
            qemu-img convert -c -O qcow2 android.qcow2 android_compressed.qcow2
            mv android_compressed.qcow2 android.qcow2

            echo "2. Đóng gói và cắt nhỏ file backup..."
            tar -czf android_disk.tar.gz android.qcow2
            split -b 40M android_disk.tar.gz android_disk.tar.gz.part
            rm -f android_disk.tar.gz
          fi

          touch androidinstalled.flag

          git add androidinstalled.flag
          for file in android_disk.tar.gz.part*; do
            if [ -f "$file" ]; then
              git add "$file"
              git commit -m "Backup part $file [skip ci]" || true
              for i in {1..5}; do
                git pull origin main --rebase || true
                git push origin main --force-with-lease && echo "Push thành công $file" && break || sleep 10
              done
            fi
          done
