name: Windows 10 22H2 QEMU UEFI on Ubuntu

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Nhập Tailscale Authkey của ní vào đây'
        required: true
        default: ''

concurrency:
  group: win10-qemu-runner
  cancel-in-progress: true

jobs:
  run-win10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Desktop, QEMU, OVMF, SPICE Server & Tailscale
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies x11vnc xvfb qemu-system-x86 qemu-utils ovmf wget curl spice-vdagent libspice-server-dev
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ github.event.inputs.tailscale_authkey }}
        run: |
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-ubuntu-qemu --accept-routes || true

      - name: Launch Ubuntu Desktop SPICE Server (:0 - Port 5900)
        run: |
          Xvfb :0 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:0 startxfce4 > /dev/null 2>&1 &
          sleep 2
          x11vnc -display :0 -forever -shared -rfbport 5900 -nopw > /dev/null 2>&1 &
          sleep 2

      - name: Restore System Disk
        run: |
          if ls win10_disk.tar.gz.part* 1> /dev/null 2>&1; then
            echo "Đang ghép và khôi phục đĩa Win 10 từ backup..."
            cat win10_disk.tar.gz.part* > win10_disk.tar.gz
            tar -xzf win10_disk.tar.gz
            touch win10_installed.flag
            rm -f win10_disk.tar.gz
          else
            echo "Chưa có backup, khởi tạo đĩa QCOW2 128GB mới..."
            qemu-img create -f qcow2 win10.qcow2 128G
          fi

      - name: Download Windows 10 ISO (Chỉ tải nếu chưa cài)
        run: |
          if [ ! -f "win10_installed.flag" ]; then
            echo "Đang tải ISO Tiny10 từ Archive.org..."
            wget -O win10.iso "https://archive.org/download/tiny-10-23-h2/tiny10%20x64%2023h2.iso"
          fi

      - name: Launch QEMU Windows 10 with QXL & SPICE Compression
        run: |
          CDROM_ARG=""
          BOOT_ARG=""

          if [ ! -f "win10_installed.flag" ] && [ -f "win10.iso" ]; then
            echo "Chưa có flag: Ép Boot từ ISO..."
            CDROM_ARG="-drive file=win10.iso,media=cdrom,if=none,id=cdrom0 -device ide-cd,bus=ahci0.1,drive=cdrom0"
            BOOT_ARG="-boot order=d,menu=on"
          else
            echo "Đã cài xong: Boot từ đĩa cứng..."
            BOOT_ARG="-boot order=c"
          fi

          OVMF_PATH=$(ls /usr/share/OVMF/OVMF_CODE*.fd /usr/share/ovmf/OVMF*.fd 2>/dev/null | head -n 1)

          sudo qemu-system-x86_64 \
            -enable-kvm -cpu host,kvm=off -smp 4 -m 8192 $BOOT_ARG \
            -drive if=pflash,format=raw,readonly=on,file=$OVMF_PATH \
            -vga qxl -global qxl-vga.vram_size=134217728 \
            -device ahci,id=ahci0 \
            -drive file=win10.qcow2,format=qcow2,if=none,id=hda0,discard=unmap,cache=unsafe,cache.direct=on,l2-cache-size=512M,throttling.bps-total=536870912,aio=threads,detect-zeroes=on \
            -device ide-hd,bus=ahci0.0,drive=hda0,rotation_rate=1 \
            $CDROM_ARG \
            -device usb-ehci,id=usb -device usb-tablet,bus=usb.0 \
            -net nic,model=e1000 -net user,hostfwd=tcp::3389-:3389 \
            -audiodev spice,id=snd0 -device intel-hda -device hda-duplex,audiodev=snd0 \
            -display none \
            -spice port=5902,addr=0.0.0.0,disable-ticketing=true,image-compression=glz,jpeg-wan-compression=always,zlib-glz-wan-compression=always,streaming-video=filter,playback-compression=on > /dev/null 2>&1 &
          sleep 3

      - name: Show Connection Info
        run: |
          sleep 5
          tailscale_ip=$(tailscale ip -4 || echo "Chưa kết nối Tailscale")
          echo "=========================================="
          echo "IP TAILSCALE UBUNTU HOST: $tailscale_ip"
          echo "1. VNC UBUNTU DESKTOP: $tailscale_ip:5900"
          echo "2. SPICE QEMU WIN 10:  $tailscale_ip:5902"
          echo "3. RDP WINDOWS 10:     $tailscale_ip:3389"
          echo "=========================================="

      - name: Keep Alive (3 Hours)
        run: |
          sleep 10800

      - name: Backup Disk Before Runner Expires
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config --global http.postBuffer 524288000

          sudo pkill -f qemu-system-x86_64 || true
          sleep 5

          rm -f win10_disk.tar.gz*

          if [ -f "win10.qcow2" ]; then
            echo "Đang nén đĩa win10.qcow2 (cắt nhỏ 20MB để chống lỗi mạng GitHub)..."
            tar -czf win10_disk.tar.gz win10.qcow2
            split -b 20M win10_disk.tar.gz win10_disk.tar.gz.part
            rm -f win10_disk.tar.gz
          fi

          touch win10_installed.flag

          git add win10_disk.tar.gz.part* win10_installed.flag || true
          git commit -m "Auto backup Win10 QEMU Disk [skip ci]" || true
          
          echo "Đang đẩy dữ liệu lên GitHub (có cơ chế thử lại nếu lỗi)..."
          for i in {1..3}; do
            git push && break || echo "Lần push thứ $i thất bại, đang thử lại..."
            sleep 5
          done
