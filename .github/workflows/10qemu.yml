name: Windows 10 22H2 QEMU UEFI on Ubuntu

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Nhập Tailscale Authkey'
        required: true
        default: ''
      iso_type:
        description: 'Chọn phiên bản ISO'
        required: true
        default: 'lite'
        type: choice
        options:
          - 'lite'
          - 'medlite'
          - 'superlite'
          - 'tiny10'
          - 'tiny10v2'
          - 'tiny10v3'
          - 'tiny10v4'
      disk_type:
        description: 'Chọn chuẩn ổ đĩa'
        required: true
        default: 'ahci'
        type: choice
        options:
          - 'ahci'
          - 'nvme'
          - 'scsi'
          - 'megasas'
          - 'ide'
      cpu_type:
        description: 'Chọn cấu hình CPU'
        required: true
        default: 'host'
        type: choice
        options:
          - 'host'
          - 'max'
          - 'qemu64'
          - 'qemu32'
          - 'kvm64'
          - 'kvm32'
          - 'Skylake Server'
          - 'Skylake Client'
          - 'Skylake tăng tốc'
          - 'kvm64 tăng tốc'
          - 'kvm32 tăng tốc'
          - 'cpu Haswell'
      cpu_clock:
        description: 'Chọn xung nhịp GHz'
        required: true
        default: 'host (mặc định)'
        type: choice
        options:
          - 'host (mặc định)'
          - '0.80 GHz'
          - '1.00 GHz'
          - '1.40 GHz'
          - '1.60 GHz'
          - '1.90 GHz'
          - '2.30 GHz'
          - '2.40 GHz'
          - '2.80 GHz'
          - '3.20 GHz'
          - '3.60 GHz'
          - '4.00 GHz'
          - '4.50 GHz'
          - '6.40 GHz'
          - '7.20 GHz'
      cpu_cores:
        description: 'Chọn số Core'
        required: true
        default: '4 core (mặc định)'
        type: choice
        options:
          - '4 core (mặc định)'
          - '2 core'
          - '1 core'
          - '6 core'
          - '8 core'
          - '12 core'
      cpu_threads:
        description: 'Chọn số Luồng'
        required: true
        default: '1 luồng (mặc định)'
        type: choice
        options:
          - '1 luồng (mặc định)'
          - '2 luồng'
          - '4 luồng'
      enable_tpm:
        description: 'Bật TPM 2.0 (y: bật, n: tắt)'
        required: true
        default: 'n'
        type: choice
        options:
          - 'y'
          - 'n'

concurrency:
  group: win10-qemu-runner
  cancel-in-progress: false

jobs:
  run-win10:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Dependencies & Setup Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies x11vnc xvfb qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools wget curl spice-vdagent libspice-server-dev git-lfs
          git lfs install
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Download Selected Windows 10 Custom ROM
        env:
          ISO_CHOICE: ${{ github.event.inputs.iso_type }}
        run: |
          if [ ! -f "win10_installed.flag" ]; then
            CHOICE=$(echo "$ISO_CHOICE" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
            case "$CHOICE" in
              "medlite" | "mediumlite")
                ISO_URL="https://stranger-apparatus-mic-town.trycloudflare.com/win10medlite.iso"
                ;;
              "superlite")
                ISO_URL="https://stranger-apparatus-mic-town.trycloudflare.com/w10superlite.iso"
                ;;
              "tiny10" | "tiny" | "win10tiny")
                ISO_URL="https://archive.org/download/win-10-tiny-os-10-22-h-2/Win10_TinyOS10%2822H2%29.iso"
                ;;
              "tiny10v2" | "tinyv2" | "win10tinyv2")
                ISO_URL="https://stranger-apparatus-mic-town.trycloudflare.com/tiny10v2.iso"
                ;;
              "tiny10v3" | "tinyv3" | "win10tinyv3")
                ISO_URL="https://stranger-apparatus-mic-town.trycloudflare.com/win10tinyv3.iso"
                ;;
              "tiny10v4" | "tinyv4" | "win10tinyv4")
                ISO_URL="https://stranger-apparatus-mic-town.trycloudflare.com/tiny10v4.iso"
                ;;
              *)
                ISO_URL="https://stranger-apparatus-mic-town.trycloudflare.com/win10lite.iso"
                ;;
            esac
            echo "Đang tải ISO: $ISO_URL"
            wget -O win10.iso "$ISO_URL"
          fi

      - name: Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ github.event.inputs.tailscale_authkey }}
        run: |
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-ubuntu-qemu --accept-routes || true

      - name: Launch Ubuntu Desktop SPICE Server (:0 - Port 5900)
        run: |
          Xvfb :0 -screen 0 1280x720x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:0 startxfce4 > /dev/null 2>&1 &
          sleep 2
          x11vnc -display :0 -forever -shared -rfbport 5900 -nopw > /dev/null 2>&1 &
          sleep 2

      - name: Restore System Disk
        run: |
          if ls win10_disk.tar.gz.part* 1> /dev/null 2>&1; then
            echo "Đang ghép và khôi phục đĩa Win 10 từ backup..."
            cat win10_disk.tar.gz.part* > win10_disk.tar.gz
            tar -xzf win10_disk.tar.gz
            touch win10_installed.flag
            rm -f win10_disk.tar.gz
          else
            echo "Khởi tạo đĩa QCOW2 128GB mới..."
            qemu-img create -f qcow2 win10.qcow2 128G
          fi

      - name: Launch QEMU Windows 10
        env:
          DISK_CHOICE: ${{ github.event.inputs.disk_type }}
          CPU_CHOICE: ${{ github.event.inputs.cpu_type }}
          CLOCK_CHOICE: ${{ github.event.inputs.cpu_clock }}
          CORES_CHOICE: ${{ github.event.inputs.cpu_cores }}
          THREADS_CHOICE: ${{ github.event.inputs.cpu_threads }}
          TPM_CHOICE: ${{ github.event.inputs.enable_tpm }}
        run: |
          CDROM_ARG=""
          BOOT_ARG=""

          # Tắt boot PXE/HTTP bằng strict boot order
          if [ ! -f "win10_installed.flag" ] && [ -f "win10.iso" ]; then
            CDROM_ARG="-drive file=win10.iso,media=cdrom,readonly=on"
            BOOT_ARG="-boot order=dc,menu=on,strict=on"
          else
            BOOT_ARG="-boot order=c,menu=on,strict=on"
          fi

          OVMF_PATH=$(ls /usr/share/OVMF/OVMF_CODE*.fd /usr/share/ovmf/OVMF*.fd 2>/dev/null | head -n 1)

          # 1. Cấu hình đĩa cứng
          case "$DISK_CHOICE" in
            "nvme")
              DRIVE_CTRL=""
              DRIVE_DEV="-drive file=win10.qcow2,format=qcow2,if=none,id=hda0,discard=unmap,cache=writeback,aio=threads -device nvme,serial=nvme-1,drive=hda0"
              ;;
            "scsi")
              DRIVE_CTRL="-device mptsas1068,id=scsi0"
              DRIVE_DEV="-drive file=win10.qcow2,format=qcow2,if=none,id=hda0,discard=unmap,cache=writeback,aio=threads -device scsi-hd,bus=scsi0.0,scsi-id=0,drive=hda0"
              ;;
            "megasas")
              DRIVE_CTRL="-device megasas,id=scsi0"
              DRIVE_DEV="-drive file=win10.qcow2,format=qcow2,if=none,id=hda0,discard=unmap,cache=writeback,aio=threads -device scsi-hd,bus=scsi0.0,scsi-id=0,drive=hda0"
              ;;
            "ide")
              DRIVE_CTRL=""
              DRIVE_DEV="-drive file=win10.qcow2,format=qcow2,if=ide,index=0,media=disk,cache=writeback,aio=threads"
              ;;
            *)
              DRIVE_CTRL="-device ahci,id=ahci0"
              DRIVE_DEV="-drive file=win10.qcow2,format=qcow2,if=none,id=hda0,discard=unmap,cache=writeback,cache.direct=off,l2-cache-size=768M,throttling.bps-total=805306368,aio=threads,detect-zeroes=on -device ide-hd,bus=ahci0.0,drive=hda0,rotation_rate=1"
              ;;
          esac

          # 2. Xử lý Cấu hình CPU Model
          case "$CPU_CHOICE" in
            "max") CPU_MODEL="max" ;;
            "qemu64") CPU_MODEL="qemu64" ;;
            "qemu32") CPU_MODEL="qemu32" ;;
            "kvm64") CPU_MODEL="kvm64" ;;
            "kvm32") CPU_MODEL="kvm32" ;;
            "Skylake Server") CPU_MODEL="Skylake-Server" ;;
            "Skylake Client") CPU_MODEL="Skylake-Client" ;;
            "Skylake tăng tốc") CPU_MODEL="Skylake-Client-v4" ;;
            "kvm64 tăng tốc") CPU_MODEL="kvm64,+kvm_pv_eoi,+kvm_pv_unhalt" ;;
            "kvm32 tăng tốc") CPU_MODEL="kvm32,+kvm_pv_eoi,+kvm_pv_unhalt" ;;
            "cpu Haswell") CPU_MODEL="Haswell-noTSX-IBRS" ;;
            *) CPU_MODEL="host,migratable=off,lm=on,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time,hv_synic,hv_stimer,hv_reset,hv_vpindex,hv_runtime,hv_tlbflush,hv_ipi,kvm=off" ;;
          esac

          # 3. Xử lý Xung nhịp GHz (tsc-frequency)
          FREQ_FLAG=""
          case "$CLOCK_CHOICE" in
            "0.80 GHz") FREQ_FLAG=",tsc-frequency=800000000" ;;
            "1.00 GHz") FREQ_FLAG=",tsc-frequency=1000000000" ;;
            "1.40 GHz") FREQ_FLAG=",tsc-frequency=1400000000" ;;
            "1.60 GHz") FREQ_FLAG=",tsc-frequency=1600000000" ;;
            "1.90 GHz") FREQ_FLAG=",tsc-frequency=1900000000" ;;
            "2.30 GHz") FREQ_FLAG=",tsc-frequency=2300000000" ;;
            "2.40 GHz") FREQ_FLAG=",tsc-frequency=2400000000" ;;
            "2.80 GHz") FREQ_FLAG=",tsc-frequency=2800000000" ;;
            "3.20 GHz") FREQ_FLAG=",tsc-frequency=3200000000" ;;
            "3.60 GHz") FREQ_FLAG=",tsc-frequency=3600000000" ;;
            "4.00 GHz") FREQ_FLAG=",tsc-frequency=4000000000" ;;
            "4.50 GHz") FREQ_FLAG=",tsc-frequency=4500000000" ;;
            "6.40 GHz") FREQ_FLAG=",tsc-frequency=6400000000" ;;
            "7.20 GHz") FREQ_FLAG=",tsc-frequency=7200000000" ;;
            *) FREQ_FLAG="" ;;
          esac

          CPU_ARG="-cpu ${CPU_MODEL}${FREQ_FLAG}"

          # 4. Xử lý Cores & Threads
          case "$CORES_CHOICE" in
            "1 core") C_NUM=1 ;;
            "2 core") C_NUM=2 ;;
            "6 core") C_NUM=6 ;;
            "8 core") C_NUM=8 ;;
            "12 core") C_NUM=12 ;;
            *) C_NUM=4 ;;
          esac

          case "$THREADS_CHOICE" in
            "2 luồng") T_NUM=2 ;;
            "4 luồng") T_NUM=4 ;;
            *) T_NUM=1 ;;
          esac

          TOTAL_CPUS=$(( C_NUM * T_NUM ))
          SMP_ARG="-smp ${TOTAL_CPUS},sockets=1,cores=${C_NUM},threads=${T_NUM}"

          # 5. Cấu hình TPM 2.0
          TPM_ARG=""
          if [ "$TPM_CHOICE" = "y" ]; then
            echo "Đang khởi tạo TPM 2.0 ảo..."
            mkdir -p /tmp/mytpm
            swtpm socket --tpmstate dir=/tmp/mytpm --ctrl type=unixio,path=/tmp/mytpm/swtpm-sock --tpm2 &
            sleep 2
            TPM_ARG="-chardev socket,id=chrtpm,path=/tmp/mytpm/swtpm-sock -tpmdev emulator,id=tpm0,chardev=chrtpm -device tpm-tis,tpmdev=tpm0"
          fi

          # Tắt Boot PXE/HTTP bằng romfile="" trên device e1000
          sudo qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,hpet=off,accel=kvm \
            $CPU_ARG \
            $SMP_ARG -m 8192 \
            -vga qxl -global qxl-vga.vram_size=134217728 $BOOT_ARG \
            -drive if=pflash,format=raw,readonly=on,file=$OVMF_PATH \
            $DRIVE_CTRL \
            $DRIVE_DEV \
            $CDROM_ARG \
            $TPM_ARG \
            -device usb-ehci,id=usb -device usb-tablet,bus=usb.0 \
            -netdev user,id=net0,hostfwd=tcp::3389-:3389 \
            -device e1000,netdev=net0,romfile="" \
            -audiodev spice,id=snd0 -device intel-hda -device hda-duplex,audiodev=snd0 \
            -display none \
            -spice port=5902,addr=0.0.0.0,disable-ticketing=true,image-compression=glz,jpeg-wan-compression=always,zlib-glz-wan-compression=always,streaming-video=filter,playback-compression=on &
          sleep 3

      - name: Show Connection Info
        run: |
          sleep 5
          tailscale_ip=$(tailscale ip -4 || echo "Chưa kết nối Tailscale")
          echo "=========================================="
          echo "IP TAILSCALE UBUNTU HOST: $tailscale_ip"
          echo "1. VNC UBUNTU DESKTOP: $tailscale_ip:5900"
          echo "2. SPICE QEMU WIN 10:  $tailscale_ip:5902"
          echo "3. RDP WINDOWS 10:     $tailscale_ip:3389"
          echo "=========================================="

      - name: Keep Alive (4 Hours)
        run: |
          sleep 14400

      - name: Backup Disk Before Runner Expires
        if: always()
        run: |
          # 1. Phát hiện sự kiện Cancel / Tắt Runner
          if [ "${{ job.status }}" == "cancelled" ]; then
            echo "================================================="
            echo "PHÁT HIỆN YÊU CẦU HỦY WORKFLOW (CANCELLED)!"
            echo "================================================="
            
            # Hỏi xác nhận Hủy
            CONFIRM_CANCEL="y"
            read -t 30 -p "Bạn có chắc chắn muốn hủy không? (y/n) [Mặc định y sau 30s]: " CONFIRM_CANCEL || CONFIRM_CANCEL="y"
            CONFIRM_CANCEL=$(echo "$CONFIRM_CANCEL" | tr '[:upper:]' '[:lower:]')

            if [ "$CONFIRM_CANCEL" != "y" ]; then
              echo "Đã hủy thao tác thoát. Tiếp tục giữ máy chạy..."
              exit 1
            fi

            # Hỏi Lưu dữ liệu
            SAVE_DATA="y"
            read -t 30 -p "Bạn có muốn lưu dữ liệu/backup đĩa cứng trước khi thoát không? (y/n) [Mặc định y sau 30s]: " SAVE_DATA || SAVE_DATA="y"
            SAVE_DATA=$(echo "$SAVE_DATA" | tr '[:upper:]' '[:lower:]')

            if [ "$SAVE_DATA" != "y" ]; then
              echo "Người dùng chọn KHÔNG lưu dữ liệu. Thoát ngay lập tức!"
              sudo pkill -f qemu-system-x86_64 || true
              exit 0
            fi
          fi

          echo "Đang tiến hành dừng QEMU và Backup dữ liệu..."
          sudo pkill -f qemu-system-x86_64 || true
          sudo pkill -f swtpm || true
          sleep 5

          # Cấu hình Git chống đứt nét HTTP 500
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 9

          # Kéo các commit mới nhất về để tránh bị từ chối Push (Fetch & Rebase)
          git fetch origin main || true
          git rebase origin main || true

          git rm -f win10_disk.tar.gz.part* || true
          rm -f win10_disk.tar.gz*

          if [ -f "win10.qcow2" ]; then
            echo "1. Đang nén tối ưu đĩa QCOW2..."
            qemu-img convert -c -O qcow2 win10.qcow2 win10_compressed.qcow2
            mv win10_compressed.qcow2 win10.qcow2

            echo "2. Đóng gói và chia nhỏ mảnh 40MB..."
            tar -czf win10_disk.tar.gz win10.qcow2
            split -b 40M win10_disk.tar.gz win10_disk.tar.gz.part
            rm -f win10_disk.tar.gz
          fi

          touch win10_installed.flag

          # Commit và Push đẩy dữ liệu an toàn
          git add win10_installed.flag
          for file in win10_disk.tar.gz.part*; do
            if [ -f "$file" ]; then
              git add "$file"
              git commit -m "Backup part $file [skip ci]" || true
              for i in {1..5}; do
                git pull origin main --rebase || true
                git push origin main --force-with-lease && echo "Push thành công $file" && break || sleep 10
              done
            fi
          done
